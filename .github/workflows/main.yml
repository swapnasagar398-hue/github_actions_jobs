name: unit testing

on:
  push:
    branches:
      - main

jobs:
  build_test_cases:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install required library
        run: pip install -r requirements.txt

      - name: execute test cases
        run: pytest --cov=calc --cov-report=
        
      - name: executed build test cases
        run: echo "build executed sucessfully"

  deploy:
    runs-on: ubuntu-latest
    needs: build_test_cases

    steps:
      - name: execute deployment
        run: echo "successfully deployed"

  



  

